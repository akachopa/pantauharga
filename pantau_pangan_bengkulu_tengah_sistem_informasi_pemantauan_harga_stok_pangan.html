    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById('toastBox');
      const text = document.getElementById('toastMessage');
      text.textContent = msg;
      box.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 2600);
    }

    function openModal(title, htmlContent, onMount) {
      document.getElementById('modalTitle').textContent = title;
      const body = document.getElementById('modalBody');
      body.innerHTML = htmlContent;
      const modal = document.getElementById('appModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (typeof onMount === 'function') onMount(body);
    }

    function closeModal() {
      const modal = document.getElementById('appModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function navigateTo(view) {
      state.currentView = view;
      document.getElementById('headerBreadcrumbCurrent').textContent = viewTitles[view] || 'Dashboard';

      // Update sidebar buttons
      document.querySelectorAll('.nav-item').forEach(btn => {
        const isMatch = btn.getAttribute('data-nav') === view;
        if (isMatch) {
          btn.className = 'nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold bg-brand-50 text-brand-700 border border-brand-200/60 transition-colors';
        } else {
          btn.className = 'nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100/80 hover:text-slate-900 transition-colors';
        }
      });

      // Update top quick switcher pills
      document.querySelectorAll('.quick-pill').forEach(btn => {
        const isMatch = btn.getAttribute('data-nav') === view;
        if (isMatch) {
          btn.className = 'quick-pill px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500 text-white shadow-xs transition-colors';
        } else {
          btn.className = 'quick-pill px-2.5 py-1 rounded-lg text-xs font-medium text-emerald-100/80 hover:bg-emerald-800/70 hover:text-white transition-colors';
        }
      });

      // Update mobile bottom navigation
      document.querySelectorAll('.mobile-bottom-item').forEach(btn => {
        const navTarget = btn.getAttribute('data-nav');
        const isMatch = navTarget === view || (navTarget === 'tabulasi' && view === 'master');
        if (isMatch) {
          btn.className = 'mobile-bottom-item flex flex-col items-center justify-center py-1 rounded-lg text-[11px] font-semibold text-brand-600';
        } else {
          btn.className = 'mobile-bottom-item flex flex-col items-center justify-center py-1 rounded-lg text-[11px] font-medium text-slate-500 hover:text-slate-800';
        }
      });

      closeMobileDrawer();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openMobileDrawer() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('mobileDrawerOverlay').classList.remove('hidden');
    }

    function closeMobileDrawer() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('mobileDrawerOverlay').classList.add('hidden');
    }

          ${subTabs.map(t => `
            <button type="button" data-setsub="${t.name}" class="set-subtab pb-3 flex items-center gap-2 text-xs sm:text-sm font-semibold whitespace-nowrap border-b-2 transition-colors ${state.pengaturan.subTab === t.name ? 'border-brand-600 text-brand-700' : 'border-transparent text-slate-500 hover:text-slate-800'}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="${t.icon}"/></svg>
              <span>${t.name}</span>
            </button>
          `).join('')}
        </div>

        <!-- Main Layout: User List (Left 4 cols on desktop, Dropdown on mobile) + RBAC Matrix (Right 8 cols) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <!-- Mobile User Selector Dropdown (Matches Mobile Screenshot 6) -->
          <div class="lg:hidden bg-white rounded-2xl p-3.5 border border-slate-200/80 card-shadow flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-full bg-emerald-100 text-brand-700 font-bold text-sm flex items-center justify-center shrink-0">${activeUser.inisial}</div>
              <div class="min-w-0">
                <select id="mobileUserSelect" class="font-bold text-slate-900 text-sm bg-transparent focus:outline-none">
                  ${state.pengaturan.users.map(u => `<option value="${u.id}" ${u.id === activeUser.id ? 'selected' : ''}>${u.nama}</option>`).join('')}
                </select>
                <div class="text-xs text-slate-500 truncate">${activeUser.email}</div>
              </div>
            </div>
          </div>

          <!-- Desktop Left User List Card -->
          <div class="hidden lg:flex lg:col-span-4 bg-white rounded-2xl p-5 border border-slate-200/70 card-shadow flex-col justify-between space-y-4">
            <div class="space-y-3.5">
              <h3 class="text-base font-bold text-slate-900">Daftar Pengguna</h3>
              <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 flex items-center">
                <svg class="w-4 h-4 text-slate-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input id="userSearchInput" type="text" value="${state.pengaturan.userSearch}" placeholder="Cari pengguna..." class="w-full bg-transparent text-xs text-slate-700 focus:outline-none" />
              </div>

              <div class="space-y-1.5 pt-1">
                ${filteredUsers.map(u => {
                  const isSel = u.id === activeUser.id;
                  return `
                    <button type="button" data-user-id="${u.id}" class="user-row-btn w-full p-3 rounded-xl flex items-center justify-between text-left transition-colors ${isSel ? 'bg-emerald-50/90 border border-emerald-200' : 'hover:bg-slate-50'}">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-10 h-10 rounded-full ${isSel ? 'bg-emerald-200 text-emerald-900' : 'bg-slate-100 text-slate-700'} font-bold text-sm flex items-center justify-center shrink-0">
                          ${u.inisial}
                        </div>
                        <div class="min-w-0">
                          <div class="font-bold text-slate-900 text-sm truncate">${u.nama}</div>
                          <div class="text-xs text-slate-500 truncate">${u.email}</div>
                        </div>
                      </div>
                      ${isSel ? `<svg class="w-4 h-4 text-brand-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>` : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <button id="btnAddUser" type="button" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 shadow-xs transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"/></svg>
              <span>Pengguna</span>
            </button>
          </div>

          <!-- Right Column: Hak Akses & Cakupan Akses -->
          <div class="lg:col-span-8 bg-white rounded-2xl p-5 sm:p-6 border border-slate-200/70 card-shadow space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-lg font-bold text-slate-900">Hak akses — ${activeUser.nama}</h2>
                <p class="text-xs text-slate-500 mt-0.5">Atur menu dan aksi yang dapat diakses oleh pengguna ini.</p>
              </div>
              <div class="sm:w-48">
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Template peran</label>
                <select id="roleTemplateSelect" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm font-semibold text-slate-800 bg-white">
                  <option value="Operator" ${activeUser.role === 'Operator' ? 'selected' : ''}>Operator</option>
                  <option value="Verifikator" ${activeUser.role === 'Verifikator' ? 'selected' : ''}>Verifikator</option>
                  <option value="Pimpinan" ${activeUser.role === 'Pimpinan' ? 'selected' : ''}>Pimpinan</option>
                  <option value="Admin" ${activeUser.role === 'Admin' ? 'selected' : ''}>Admin</option>
                  <option value="Mitra" ${activeUser.role === 'Mitra' ? 'selected' : ''}>Mitra</option>
                </select>
              </div>
            </div>

            <!-- Permission Matrix Table (Lihat/L, Input/I, Verifikasi/V, Ekspor/E) -->
            <div class="border border-slate-200/80 rounded-2xl overflow-hidden">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50/90 border-b border-slate-200/70 text-xs font-semibold text-slate-600">
                    <th class="py-3 px-4">Menu</th>
                    <th class="py-3 px-3 text-center"><span class="hidden sm:inline">Lihat</span><span class="sm:hidden">L</span></th>
                    <th class="py-3 px-3 text-center"><span class="hidden sm:inline">Input</span><span class="sm:hidden">I</span></th>
                    <th class="py-3 px-3 text-center"><span class="hidden sm:inline">Verifikasi</span><span class="sm:hidden">V</span></th>
                    <th class="py-3 px-3 text-center"><span class="hidden sm:inline">Ekspor</span><span class="sm:hidden">E</span></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
                  ${menuRows.map(row => {
                    const perm = activeUser.permissions[row.key];
                    return `
                      <tr>
                        <td class="py-3.5 px-4 font-semibold text-slate-800">
                          <div class="flex items-center gap-2.5">
                            <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="${row.icon}"/></svg>
                            <span>${row.label}</span>
                          </div>
                        </td>
                        ${['l', 'i', 'v', 'e'].map(act => `
                          <td class="py-3.5 px-3 text-center">
                            <button type="button" data-perm-menu="${row.key}" data-perm-act="${act}" class="perm-check-btn w-5 h-5 rounded-md inline-flex items-center justify-center border transition-colors ${perm[act] ? 'bg-brand-600 border-brand-600 text-white' : 'bg-white border-slate-300 text-transparent hover:border-brand-500'}">
                              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                            </button>
                          </td>
                        `).join('')}
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>

            <!-- Cakupan Akses -->
            <div class="space-y-3">
              <h3 class="text-sm font-bold text-slate-900">Cakupan Akses</h3>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                <!-- Cakupan Lihat -->
                <div>
                  <label class="block text-xs text-slate-500 font-medium mb-1">Cakupan lihat</label>
                  <select id="cakupanLihatSelect" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-semibold text-slate-800 bg-white">
                    <option value="Seluruh kabupaten" ${activeUser.cakupanLihat === 'Seluruh kabupaten' ? 'selected' : ''}>Seluruh kabupaten</option>
                    <option value="Kecamatan Karang Tinggi" ${activeUser.cakupanLihat === 'Kecamatan Karang Tinggi' ? 'selected' : ''}>Kecamatan Karang Tinggi</option>
                  </select>
                </div>

                <!-- Cakupan Input Chips -->
                <div>
                  <label class="block text-xs text-slate-500 font-medium mb-1">Cakupan input</label>
                  <div class="border border-slate-200 rounded-xl p-2 min-h-[42px] flex flex-wrap gap-1.5 items-center bg-white">
                    ${activeUser.cakupanInput.map(tag => `
                      <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-medium">
                        <span>${tag}</span>
                        <button type="button" data-remove-input-tag="${tag}" class="text-slate-400 hover:text-rose-600">×</button>
                      </span>
                    `).join('')}
                  </div>
                </div>

                <!-- Titik Pantau Chips -->
                <div>
                  <label class="block text-xs text-slate-500 font-medium mb-1">Titik pantau</label>
                  <div class="border border-slate-200 rounded-xl p-2 min-h-[42px] flex flex-wrap gap-1.5 items-center bg-white">
                    ${activeUser.titikPantau.map(tag => `
                      <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-medium">
                        <span>${tag}</span>
                        <button type="button" data-remove-titik-tag="${tag}" class="text-slate-400 hover:text-rose-600">×</button>
                      </span>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>

            <!-- Footer Note & Save Button -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
              <div class="bg-blue-50/80 border border-blue-200/70 rounded-xl px-3.5 py-2.5 flex items-center gap-2 text-xs text-blue-900 font-medium">
                <svg class="w-4 h-4 text-blue-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Tidak dapat memverifikasi laporan sendiri.</span>
              </div>

              <button id="btnSimpanPengaturan" type="button" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-xs transition-colors">
                Simpan perubahan
              </button>
            </div>
          </div>
        </div>
      `;

      // Subtab listener
      container.querySelectorAll('.set-subtab').forEach(btn => {
        btn.addEventListener('click', () => {
          state.pengaturan.subTab = btn.getAttribute('data-setsub');
          renderPengaturan(container);
        });
      });

      // User selection (desktop)
      container.querySelectorAll('.user-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.pengaturan.selectedUserId = btn.getAttribute('data-user-id');
          renderPengaturan(container);
        });
      });

      // User selection (mobile dropdown)
      const mobUserSel = document.getElementById('mobileUserSelect');
      if (mobUserSel) {
        mobUserSel.addEventListener('change', e => {
          state.pengaturan.selectedUserId = e.target.value;
          renderPengaturan(container);
        });
      }

      // User search
      const uSearch = document.getElementById('userSearchInput');
      if (uSearch) {
        uSearch.addEventListener('input', e => {
          state.pengaturan.userSearch = e.target.value;
          renderPengaturan(container);
        });
      }

      // Permission checkbox toggle
      container.querySelectorAll('.perm-check-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const menuKey = btn.getAttribute('data-perm-menu');
          const actKey = btn.getAttribute('data-perm-act');
          activeUser.permissions[menuKey][actKey] = !activeUser.permissions[menuKey][actKey];
          renderPengaturan(container);
        });
      });

      // Remove chips
      container.querySelectorAll('[data-remove-input-tag]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tag = btn.getAttribute('data-remove-input-tag');
          activeUser.cakupanInput = activeUser.cakupanInput.filter(t => t !== tag);
          renderPengaturan(container);
        });
      });

      container.querySelectorAll('[data-remove-titik-tag]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tag = btn.getAttribute('data-remove-titik-tag');
          activeUser.titikPantau = activeUser.titikPantau.filter(t => t !== tag);
          renderPengaturan(container);
        });
      });

      // Save settings
      const saveSetBtn = document.getElementById('btnSimpanPengaturan');
      if (saveSetBtn) {
        saveSetBtn.addEventListener('click', () => {
          activeUser.role = document.getElementById('roleTemplateSelect').value;
          activeUser.cakupanLihat = document.getElementById('cakupanLihatSelect').value;
          showToast(`Hak akses ${activeUser.nama} berhasil disimpan`);
        });
      }

      // Add User Modal
      const addUsrBtn = document.getElementById('btnAddUser');
      if (addUsrBtn) {
        addUsrBtn.addEventListener('click', () => {
          openModal('Tambah Pengguna Baru', `
            <form id="addUserForm" class="space-y-3">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                <input id="newUserName" type="text" placeholder="Contoh: Operator B" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" required />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Email Instansi</label>
                <input id="newUserEmail" type="email" placeholder="operator.b@pantaupangan.id" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" required />
              </div>
              <div class="pt-2 flex justify-end gap-2">
                <button type="button" id="cancelUserBtn" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Batal</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-semibold">Tambah Pengguna</button>
              </div>
            </form>
          `, body => {
            body.querySelector('#cancelUserBtn').addEventListener('click', closeModal);
            body.querySelector('#addUserForm').addEventListener('submit', e => {
              e.preventDefault();
              const nama = body.querySelector('#newUserName').value.trim();
              const email = body.querySelector('#newUserEmail').value.trim();
              const id = 'user_' + Date.now();
              state.pengaturan.users.push({
                id,
                inisial: nama.charAt(0).toUpperCase(),
                nama,
                email,
                role: 'Operator',
                permissions: {
                  dashboard: { l: true, i: false, v: false, e: false },
                  input: { l: true, i: true, v: false, e: false },
                  master: { l: true, i: false, v: false, e: false },
                  laporan: { l: true, i: false, v: false, e: true }
                },
                cakupanLihat: 'Seluruh kabupaten',
                cakupanInput: ['Pasar Simulasi A'],
                titikPantau: ['Toko A']
              });
              state.pengaturan.selectedUserId = id;
              closeModal();
              showToast(`Pengguna ${nama} berhasil ditambahkan`);
              renderPengaturan(container);
            });
          });
        });
      }
    }

    // =========================================================================
    // MASTER RENDER DISPATCHER & GLOBAL LISTENERS
    // =========================================================================
    function renderCurrentView() {
      const main = document.getElementById('appMain');
      const v = state.currentView;
      if (v === 'dashboard') renderDashboard(main);
      else if (v === 'tabulasi') renderTabulasi(main);
      else if (v === 'master') renderMasterData(main);
      else if (v === 'tindaklanjut') renderTindakLanjut(main);
      else if (v === 'kebijakan') renderPaketKebijakan(main);
      else if (v === 'laporan') renderLaporan(main);
      else if (v === 'pengaturan') renderPengaturan(main);
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Attach navigation listeners to all sidebar, quick-switcher, and bottom-nav buttons
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          navigateTo(btn.getAttribute('data-nav'));
        });
      });

      // Mobile drawer controls
      document.getElementById('openMobileMenuBtn').addEventListener('click', openMobileDrawer);
      document.getElementById('mobileBottomMenuBtn').addEventListener('click', openMobileDrawer);
      document.getElementById('closeMobileMenuBtn').addEventListener('click', closeMobileDrawer);
      document.getElementById('mobileDrawerOverlay').addEventListener('click', closeMobileDrawer);

      // Breadcrumb home
      document.getElementById('breadcrumbHomeBtn').addEventListener('click', () => navigateTo('dashboard'));

      // Modal close
      document.getElementById('closeModalBtn').addEventListener('click', closeModal);

      // Header Notification & Profile buttons
      document.getElementById('notifBtn').addEventListener('click', () => {
        openModal('Notifikasi Sistem (28 Okt 2026)', `
          <div class="space-y-2.5 text-xs">
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900">
              <div class="font-bold">Stok cabai menipis — Pasar Karang Tinggi</div>
              <div class="text-slate-600 mt-0.5">Stok cabai merah tercatat 12 kg (di bawah ambang batas 3 hari).</div>
            </div>
            <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-900">
              <div class="font-bold">Laporan belum masuk — Kec. Talang Empat</div>
              <div class="text-slate-600 mt-0.5">Menunggu input harian dari petugas lapangan.</div>
            </div>
          </div>
        `);
      });

      document.getElementById('profileMenuBtn').addEventListener('click', () => {
        navigateTo('pengaturan');
      });

      // Global search quick jump
      const globalSearch = document.getElementById('globalSearchInput');
      if (globalSearch) {
        globalSearch.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            const val = e.target.value.trim();
            if (val) {
              showToast(`Menampilkan hasil pencarian untuk "${val}"`);
              navigateTo('tabulasi');
            }
          }
        });
      }

      // Initial render
      navigateTo('dashboard');
    });
  </script>
</body>
</html>
